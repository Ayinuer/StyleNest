{% extends 'base.html' %}

{% block content %}

<section class="py-5" style="min-height: 85vh; background-color: #f8f9fa;">
    <div class="container">

        <div class="row justify-content-center">
            <div class="col-lg-6">

                <div class="feature-card p-4 p-md-5 bg-white rounded-4 shadow-sm border-0">

                    <div class="text-center mb-4">
                        <p class="section-kicker mb-2 text-uppercase small fw-semibold text-muted">
                            Shop Updates
                        </p>

                        <h2 class="fw-bold mb-2 text-danger">
                            Unsubscribe from {{ shop.shop_name }}
                        </h2>

                        <p class="text-muted mb-0">
                            We're sorry to see you go. Enter your phone number to unsubscribe from future updates.
                        </p>
                    </div>

                    {% include 'includes/alerts.html' %}

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Phone Number</label>
                            <input
                                type="text"
                                name="phone_number"
                                class="form-control form-control-lg"
                                placeholder="Enter your phone number"
                                required
                            >
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-danger btn-lg rounded-pill">
                                Unsubscribe
                            </button>
                        </div>
                    </form>

                    <p class="text-muted small text-center mt-4 mb-0">
                        Changed your mind?
                        <a href="{% url 'subscribe' shop.qr_token %}" class="fw-semibold text-dark">
                            Subscribe again
                        </a>
                    </p>

                </div>

            </div>
        </div>

    </div>
</section>

{% endblock %}
