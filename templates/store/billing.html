{% extends 'base.html' %}

{% block content %}
<section class="py-5" style="min-height: 80vh; background-color: #f8f9fa;">
    <div class="container">
        <div class="col-lg-8 mx-auto">
            <div class="bg-white p-5 rounded-4 shadow-sm">
                <h2 class="fw-bold mb-3">Billing & Subscription</h2>
                <p class="text-muted mb-4">
                    This page is ready for Stripe integration for monthly subscription payments and message credits.
                </p>

                <div class="border rounded-4 p-4 mb-4">
                    <h5 class="fw-bold">Basic Plan</h5>
                    <p class="text-muted mb-3">Access the platform and manage campaigns.</p>
                    <button class="btn btn-dark">Connect Stripe Checkout</button>
                </div>

                <div class="border rounded-4 p-4">
                    <h5 class="fw-bold">Pro Plan</h5>
                    <p class="text-muted mb-3">More message credits and expanded access.</p>
                    <button class="btn btn-outline-dark">Connect Stripe Checkout</button>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
