<aside class="col-md-3 mb-4">
    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-3">

            <div class="px-2 mb-3">
                <h5 class="fw-bold mb-1">Dashboard</h5>
                <p class="text-muted small mb-0">Manage your shop tools</p>
            </div>

            <div class="list-group list-group-flush">

                <a href="{% url 'dashboard' %}"
                   class="list-group-item list-group-item-action rounded-3 mb-1 {% if request.resolver_match.url_name == 'dashboard' %}active bg-dark text-white border-0{% endif %}">
                    <span class="me-2">🏠</span> Overview
                </a>

                <a href="{% url 'compose_message' %}"
                   class="list-group-item list-group-item-action rounded-3 mb-1 {% if request.resolver_match.url_name == 'compose_message' %}active bg-dark text-white border-0{% endif %}">
                    <span class="me-2">✉️</span> Compose Campaign
                </a>

                <a href="{% url 'message_history' %}"
                   class="list-group-item list-group-item-action rounded-3 mb-1 {% if request.resolver_match.url_name == 'message_history' %}active bg-dark text-white border-0{% endif %}">
                    <span class="me-2">📜</span> Message History
                </a>

                <a href="{% url 'edit_profile' %}"
                   class="list-group-item list-group-item-action rounded-3 mb-1 {% if request.resolver_match.url_name == 'edit_profile' %}active bg-dark text-white border-0{% endif %}">
                    <span class="me-2">👤</span> Shop Profile
                </a>

                <a href="{% url 'change_password' %}"
                   class="list-group-item list-group-item-action rounded-3 mb-1 {% if request.resolver_match.url_name == 'change_password' %}active bg-dark text-white border-0{% endif %}">
                    <span class="me-2">🔐</span> Security
                </a>

            </div>

            <hr class="my-3">

            <div class="px-2 mb-2">
                <h6 class="text-muted small mb-0 text-uppercase">Subscriber Access</h6>
            </div>

            <div class="list-group list-group-flush">

                <a href="{% url 'subscribe' shop_profile.qr_token %}"
                   class="list-group-item list-group-item-action rounded-3 mb-1">
                    <span class="me-2">📲</span> Subscription Page
                </a>

                <a href="{% url 'unsubscribe' shop_profile.qr_token %}"
                   class="list-group-item list-group-item-action rounded-3 mb-1">
                    <span class="me-2">❌</span> Unsubscribe Page
                </a>

            </div>

            <hr class="my-3">

            <div class="d-grid">
                <a href="{% url 'logout' %}" class="btn btn-outline-dark rounded-3">
                    <span class="me-2">🚪</span> Log out
                </a>
            </div>

        </div>
    </div>
</aside>
