<aside class="col-md-3 mb-4">
    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-3">

            <!-- Title -->
            <h5 class="fw-bold mb-3 px-2">Dashboard</h5>

            <!-- Menu -->
            <div class="list-group list-group-flush">

                <a href="{% url 'dashboard' %}"
                   class="list-group-item list-group-item-action rounded-3 mb-1 
                   {% if request.resolver_match.url_name == 'dashboard' %}active bg-dark text-white border-0{% endif %}">
                    🏠 Overview
                </a>

                <a href="{% url 'my_orders' %}"
                   class="list-group-item list-group-item-action rounded-3 mb-1 
                   {% if request.resolver_match.url_name == 'my_orders' %}active bg-dark text-white border-0{% endif %}">
                    📦 Orders
                </a>

                <a href="{% url 'wishlist' %}"
                   class="list-group-item list-group-item-action rounded-3 mb-1 
                   {% if request.resolver_match.url_name == 'wishlist' %}active bg-dark text-white border-0{% endif %}">
                    ❤️ Wishlist
                </a>

                <a href="{% url 'edit_profile' %}"
                   class="list-group-item list-group-item-action rounded-3 mb-1 
                   {% if request.resolver_match.url_name == 'edit_profile' %}active bg-dark text-white border-0{% endif %}">
                    👤 Profile
                </a>

                <a href="{% url 'change_password' %}"
                   class="list-group-item list-group-item-action rounded-3 mb-1 
                   {% if request.resolver_match.url_name == 'change_password' %}active bg-dark text-white border-0{% endif %}">
                    🔐 Security
                </a>

            </div>

            <!-- Divider -->
            <hr class="my-3">

            <!-- Subscriber Section -->
            <h6 class="text-muted small px-2 mb-2">Marketing</h6>

            <div class="list-group list-group-flush">

                <a href="{% url 'subscribe' shop_profile.qr_token %}"
                   class="list-group-item list-group-item-action rounded-3 mb-1">
                    📲 Subscription Page
                </a>

                <a href="{% url 'unsubscribe' shop_profile.qr_token %}"
                   class="list-group-item list-group-item-action rounded-3 mb-1">
                    ❌ Unsubscribe Page
                </a>

            </div>

            <!-- Divider -->
            <hr class="my-3">

            <!-- Logout -->
            <div class="d-grid">
                <a href="{% url 'logout' %}" 
                   class="btn btn-outline-dark rounded-3">
                    🚪 Log out
                </a>
            </div>

        </div>
    </div>
</aside>
