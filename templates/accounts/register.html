{% extends 'base.html' %}

{% block content %}
<section class="py-5" style="min-height: 85vh; background-color: #f8f9fa;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="feature-card p-4 p-md-5 bg-white rounded-4 shadow-sm border-0">
                    <div class="text-center mb-4">
                        <p class="section-kicker mb-2">Shop Owner Registration</p>
                        <h2 class="fw-bold mb-2">Create Your Shop Account</h2>
                        <p class="text-muted mb-0">
                            Register your business and start managing subscribers, campaigns, and shop communications.
                        </p>
                    </div>

                    {% include 'includes/alerts.html' %}

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Shop Name</label>
                            <input type="text" name="shop_name" class="form-control form-control-lg" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Username</label>
                            <input type="text" name="username" class="form-control form-control-lg" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email</label>
                            <input type="email" name="email" class="form-control form-control-lg">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Phone</label>
                            <input type="text" name="phone" class="form-control form-control-lg">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Password</label>
                            <input type="password" name="password" class="form-control form-control-lg" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Confirm Password</label>
                            <input type="password" name="confirm_password" class="form-control form-control-lg" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-dark btn-lg">Create Shop Account</button>
                        </div>
                    </form>

                    <p class="text-center text-muted mt-4 mb-0">
                        Already have an account?
                        <a href="{% url 'login' %}" class="fw-semibold text-decoration-none">Sign in</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
