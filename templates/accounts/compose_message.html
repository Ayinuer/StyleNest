{% extends 'base.html' %}

{% block content %}
<section class="py-5" style="min-height: 85vh; background-color: #f8f9fa;">
    <div class="container">
        <div class="row g-4">

            {% include 'includes/dashboard_sidebar.html' %}

            <main class="col-lg-9">
                <div class="feature-card p-4 p-md-5 bg-white rounded-4 shadow-sm border-0">
                    <h3 class="fw-bold mb-4">Compose Campaign</h3>

                    {% include 'includes/alerts.html' %}

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Campaign Title</label>
                            <input type="text" name="title" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Template</label>
                            <select name="template_type" class="form-control">
                                <option value="custom">Custom</option>
                                <option value="new_arrivals">New Arrivals</option>
                                <option value="sale_alert">Sale Alert</option>
                                <option value="birthday_offer">Birthday Offer</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Message Channel</label>
                            <select name="message_type" class="form-control">
                                <option value="sms">SMS</option>
                                <option value="whatsapp">WhatsApp</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Message Content</label>
                            <textarea name="message_body" rows="5" class="form-control"></textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Schedule for later (optional)</label>
                            <input type="datetime-local" name="scheduled_for" class="form-control">
                        </div>

                        <button type="submit" class="btn btn-dark">Create Campaign</button>
                    </form>
                </div>
            </main>

        </div>
    </div>
</section>
{% endblock %}
