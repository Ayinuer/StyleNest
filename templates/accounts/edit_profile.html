{% extends 'base.html' %}

{% block content %}
<section class="py-5" style="min-height: 85vh; background-color: #f8f9fa;">
    <div class="container">
        <div class="row g-4">
            {% include 'includes/dashboard_sidebar.html' %}

            <main class="col-lg-9">
                <div class="feature-card p-4 p-md-5 bg-white rounded-4 shadow-sm border-0">
                    <h3 class="fw-bold mb-4">Edit Shop Profile</h3>

                    {% include 'includes/alerts.html' %}

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Shop Name</label>
                            <input type="text" name="shop_name" class="form-control" value="{{ shop_profile.shop_name }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email</label>
                            <input type="email" name="email" class="form-control" value="{{ shop_profile.user.email }}">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Phone</label>
                            <input type="text" name="phone" class="form-control" value="{{ shop_profile.phone }}">
                        </div>

                        <button type="submit" class="btn btn-dark">Save Changes</button>
                    </form>
                </div>
            </main>
        </div>
    </div>
</section>
{% endblock %}
